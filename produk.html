<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Produk - Custom Balloon</title>

<style>
body {
    font-family: Arial;
    margin: 0;
}

header {
    padding: 20px;
    background: #ff007f;
    color: white;
    text-align: center;
}

.products {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 20px;
    padding: 40px;
}

.card {
    width: 250px;
    border-radius: 15px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    overflow: hidden;
    text-align: center;
}

.card img {
    width: 100%;
    height: 180px;
    object-fit: cover;
}

.card h3 {
    margin: 10px 0;
}

.card p {
    color: #ff007f;
    font-weight: bold;
}

.btn {
    display: inline-block;
    margin: 10px;
    padding: 10px 20px;
    background: #ff007f;
    color: white;
    border-radius: 20px;
    cursor: pointer;
}

/* POPUP OVERLAY */
.popup {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(6px);
    z-index: 999;
}

/* BOX POPUP */
.popup-content {
    background: #ffffff;
    padding: 25px;
    width: 90%;
    max-width: 350px;
    margin: 80px auto;
    border-radius: 20px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.2);
    animation: fadeIn 0.3s ease;
}

/* ANIMATION */
@keyframes fadeIn {
    from {
        opacity: 0;
        transform: translateY(25px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* TITLE */
.popup-content h3 {
    margin-bottom: 15px;
    color: #ff007f;
    text-align: center;
}

/* INPUT & SELECT */
.popup-content input,
.popup-content select {
    width: 100%;
    padding: 10px;
    margin: 6px 0;
    border-radius: 12px;
    border: 1px solid #ddd;
    font-size: 14px;
    outline: none;
    transition: 0.2s;
}

/* FOCUS EFFECT */
.popup-content input:focus,
.popup-content select:focus {
    border-color: #ff007f;
    box-shadow: 0 0 5px rgba(255,0,127,0.3);
}

/* BUTTON UMUM */
.popup-content button {
    width: 100%;
    padding: 12px;
    margin-top: 10px;
    border: none;
    border-radius: 25px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
}

/* BUTTON KIRIM */
.popup-content button:first-of-type {
    background: linear-gradient(to right, #ff007f, #ff4da6);
    color: white;
}

/* BUTTON BATAL */
.popup-content button:last-of-type {
    background: #f1f1f1;
    color: #333;
}

/* HOVER EFFECT */
.popup-content button:hover {
    opacity: 0.9;
}
</style>
</head>

<body>

<header>
    <h2>Produk Kami</h2>
</header>

<section class="products">

<div class="card">
    <img src="https://via.placeholder.com/300x200">
    <h3>BD01 - Decor Ulang Tahun Anak</h3>
    <p>Rp 500.000</p>
    <div class="btn" onclick="order('BD01','Decor Ulang Tahun Anak',500000)">Order</div>
</div>

<div class="card">
    <img src="https://via.placeholder.com/300x200">
    <h3>BB01 - Balloon Bouquet Bunga</h3>
    <p>Rp 150.000</p>
    <div class="btn" onclick="order('BB01','Bouquet + Bunga',150000)">Order</div>
</div>

<div class="card">
    <img src="https://via.placeholder.com/300x200">
    <h3>BT01 - Balloon Tepuk</h3>
    <p>Rp 10.000 / pcs</p>
    <div class="btn" onclick="order('BT01','Balloon Tepuk',10000)">Order</div>
</div>

</section>

<!-- POPUP -->
<div class="popup" id="popup">
  <div class="popup-content">
    <h3>Form Order</h3>

    <input type="text" id="nama" placeholder="Nama">
    <input type="text" id="alamat" placeholder="Alamat">
    <input type="text" id="telp" placeholder="No HP">

    <input type="number" id="qty" placeholder="Qty">

    <select id="warna">
      <option value="">Pilih Warna</option>
      <option>Pink</option>
      <option>Biru</option>
      <option>Kuning</option>
      <option>Hijau</option>
    </select>

    <input type="date" id="tanggal">

    <select id="kurir">
      <option value="">Pilih Kurir</option>
      <option>Grab</option>
      <option>Gojek</option>
      <option>Lalamove</option>
      <option>JNT</option>
    </select>

    <button onclick="kirimWA()">Kirim ke WhatsApp</button>
    <button onclick="tutup()">Tutup</button>
  </div>
</div>

<script>
let produk = {};
let harga = 0;

function order(kode, nama, hrg){
    produk.kode = kode;
    produk.nama = nama;
    harga = hrg;
    document.getElementById("popup").style.display = "block";
}

function tutup(){
    document.getElementById("popup").style.display = "none";
}

function kirimWA(){
    let nama = document.getElementById("nama").value;
    let alamat = document.getElementById("alamat").value;
    let telp = document.getElementById("telp").value;
    let qty = document.getElementById("qty").value;
    let warna = document.getElementById("warna").value;
    let tanggal = document.getElementById("tanggal").value;
    let kurir = document.getElementById("kurir").value;

    if(!nama || !alamat || !telp || !qty){
        alert("Mohon lengkapi data dulu ya");
        return;
    }

    if(qty < 10){
        alert("Minimum order 10 pcs!");
        return;
    }

    let total = harga * qty;

    let pesan = `Halo, saya ingin order:

🛍️ Detail Pesanan:
Kode: ${produk.kode}
Nama: ${produk.nama}
Warna: ${warna}
Qty: ${qty}
Tanggal Kirim: ${tanggal}
Kurir: ${kurir}

💰 Total: Rp ${total}

👤 Data Pemesan:
Nama: ${nama}
Alamat: ${alamat}
No HP: ${telp}
`;

    let url = "https://wa.me/628979797669?text=" + encodeURIComponent(pesan);
    window.open(url, "_blank");
}
</script>

</body>
</html>
